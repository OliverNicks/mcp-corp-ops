apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-litellm
spec:
  replicas: {{ .Values.litellm.replicaCount }}
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-v1.40.0
          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-litellm
spec:
  ports:
    - port: 4000
  selector:
    app: litellm