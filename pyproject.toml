[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-corporate-agent-platform"
version = "0.1.0"
description = "Enterprise-grade MCP gateway with AST guardrails, sub-15ms ONNX INT8 semantic cache, and GitOps observability"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "OD Enterprise" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "fastmcp",
    "ast-guardrails",
    "semantic-cache",
    "redis-hnsw",
    "onnx",
    "litellm",
    "gitops",
    "opencart",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "Topic :: Security",
]
dependencies = [
    # Core MCP Server Framework
    "fastmcp>=0.4.0",
    
    # Security Sandbox & SQL AST Parsing
    "sqlglot>=25.0.0",
    
    # Database Abstraction & Connectors
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
    
    # Local Sub-8ms Vector Inference & Tokenization
    "onnxruntime>=1.18.0",
    "tokenizers>=0.19.0",
    "numpy>=1.24.0",
    
    # Sub-15ms Redis HNSW Semantic Cache
    "redis>=5.0.0",
    
    # Configuration & Schema Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    
    # LLM Gateway & HTTP Client
    "httpx>=0.27.0",
    "litellm>=1.40.0",
    
    # Telemetry & Observability
    "prometheus-client>=0.20.0",
    "langfuse>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-redis>=4.6.0",
]
export = [
    # Model Export & INT8 Quantization Script dependencies
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
    "onnx>=1.16.0",
]
benchmark = [
    # Concurrency Load Testing
    "locust>=2.29.0",
]
all = [
    "mcp-corporate-agent-platform[dev,export,benchmark]",
]

[project.scripts]
mcp-server = "src.server.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "eval_*.py"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true